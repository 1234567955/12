
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梵谷藝術作品展示</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #f5f3ed;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
    margin: 0;
}

/* 網站標題 */
header {
    background-color: #243b55;
    color: white;
    text-align: center;
    padding: 30px;
}

header h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

/* 輪播區域 */
.carousel {
    margin-top: 25px;
}

.carousel-item img {
    width: 100%;
    height: 450px;
    object-fit: cover;
    background-color: #ddd;
}

/* 作品標題 */
h2 {
    text-align: center;
    margin: 40px 0 25px;
    color: #243b55;
}

/* 卡片排列 */
.card-container {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 20px;
    padding: 20px;
}

/* 卡片樣式 */
.card {
    height: 300px;
    border: 1px solid #ccc;
    border-radius: 6px;
    overflow: hidden;
    transition: 0.3s;
    background-color: white;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    background-color: #eee;
}

.card-body {
    text-align: center;
    padding: 12px;
}

.card-title {
    font-size: 19px;
    font-weight: bold;
}

.card-text {
    font-size: 15px;
}

/* 768px～1279px：一排4張 */
@media (min-width: 768px) and (max-width: 1279px) {
    .card-container {
        grid-template-columns: repeat(4, 1fr);
    }
}

/* 576px～767px：一排2張 */
@media (min-width: 576px) and (max-width: 767px) {
    .card-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* 576px以下：一排1張 */
@media (max-width: 575px) {
    .card-container {
        grid-template-columns: repeat(1, 1fr);
    }

    .carousel-item img {
        height: 250px;
    }
}

/* 頁尾 */
footer {
    background-color: #243b55;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 40px;
}
</style>
</head>

<body>

<!-- 網站標題 -->
<header>
    <h1>Van Gogh Art Gallery</h1>
    <p>梵谷藝術作品欣賞</p>
</header>

<!-- 輪播圖片 -->
<div class="container">

<div id="myCarousel" class="carousel slide"
     data-bs-ride="carousel">

    <!-- 輪播指示器 -->
    <div class="carousel-indicators">

        <button type="button"
        data-bs-target="#myCarousel"
        data-bs-slide-to="0"
        class="active"></button>

        <button type="button"
        data-bs-target="#myCarousel"
        data-bs-slide-to="1"></button>

        <button type="button"
        data-bs-target="#myCarousel"
        data-bs-slide-to="2"></button>

        <button type="button"
        data-bs-target="#myCarousel"
        data-bs-slide-to="3"></button>

    </div>

    <!-- 輪播內容 -->
    <div class="carousel-inner">

        <div class="carousel-item active">
            <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_Starry_Night.jpg"
            alt="星夜"
            onerror="this.onerror=null;this.src='https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_Sunflowers_-_VGM_F458.jpg';">
        </div>

        <div class="carousel-item">
            <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_Sunflowers_-_VGM_F458.jpg"
            alt="向日葵">
        </div>

        <div class="carousel-item">
            <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_Irises_-_Google_Art_Project.jpg"
            alt="鳶尾花">
        </div>

        <div class="carousel-item">
            <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/TheStarryNightByVincentVanGogh.jpg"
            alt="星夜作品">
        </div>

    </div>

    <!-- 左右按鈕 -->
    <button class="carousel-control-prev"
    type="button"
    data-bs-target="#myCarousel"
    data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

    </button>

    <button class="carousel-control-next"
    type="button"
    data-bs-target="#myCarousel"
    data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>

    </button>

</div>
</div>

<!-- 作品卡片標題 -->
<h2>梵谷經典作品</h2>

<!-- 12張卡片 -->
<div class="card-container">

    <!-- 第一張 -->
    <div class="card">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_Starry_Night.jpg"
        alt="星夜"
        onerror="this.onerror=null;this.src='https://commons.wikimedia.org/wiki/Special:FilePath/TheStarryNightByVincentVanGogh.jpg';">

        <div class="card-body">
            <h5 class="card-title">星夜</h5>
            <p class="card-text">1889年創作的經典作品。</p>
        </div>
    </div>

    <!-- 第二張 -->
    <div class="card">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_Sunflowers_-_VGM_F458.jpg"
        alt="向日葵">

        <div class="card-body">
            <h5 class="card-title">向日葵</h5>
            <p class="card-text">以鮮明黃色呈現生命力。</p>
        </div>
    </div>

    <!-- 第三張 -->
    <div class="card">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_Irises_-_Google_Art_Project.jpg"
        alt="鳶尾花">

        <div class="card-body">
            <h5 class="card-title">鳶尾花</h5>
            <p class="card-text">充滿色彩與自然氣息。</p>
        </div>
    </div>

    <!-- 第四張 -->
    <div class="card">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_Starry_Night.jpg"
        alt="自畫像">

        <div class="card-body">
            <h5 class="card-title">自畫像</h5>
            <p class="card-text">梵谷著名的自畫像作品。</p>
        </div>
    </div>

    <!-- 第五張 -->
    <div class="card">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_Sunflowers_-_VGM_F458.jpg"
        alt="臥室">

        <div class="card-body">
            <h5 class="card-title">亞爾的臥室</h5>
            <p class="card-text">描繪藝術家的生活空間。</p>
        </div>
    </div>

    <!-- 第六張 -->
    <div class="card">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_Irises_-_Google_Art_Project.jpg"
        alt="麥田群鴉">

        <div class="card-body">
            <h5 class="card-title">麥田群鴉</h5>
            <p class="card-text">展現強烈情感的風景畫。</p>
        </div>
    </div>

    <!-- 第七張 -->
    <div class="card">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_Sunflowers_-_VGM_F458.jpg"
        alt="夜晚咖啡館">

        <div class="card-body">
            <h5 class="card-title">夜晚露天咖啡座</h5>
            <p class="card-text">呈現夜晚溫暖的燈光。</p>
        </div>
    </div>

    <!-- 第八張 -->
    <div class="card">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_Irises_-_Google_Art_Project.jpg"
        alt="奧維教堂">

        <div class="card-body">
            <h5 class="card-title">奧維教堂</h5>
            <p class="card-text">以鮮明筆觸描繪建築。</p>
        </div>
    </div>

    <!-- 第九張 -->
    <div class="card">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_Sunflowers_-_VGM_F458.jpg"
        alt="杏花">

        <div class="card-body">
            <h5 class="card-title">杏花</h5>
            <p class="card-text">呈現春天盛開的花朵。</p>
        </div>
    </div>

    <!-- 第十張 -->
    <div class="card">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_Irises_-_Google_Art_Project.jpg"
        alt="黃色房子">

        <div class="card-body">
            <h5 class="card-title">黃色房子</h5>
            <p class="card-text">描繪梵谷在亞爾的住所。</p>
        </div>
    </div>

    <!-- 第十一張 -->
    <div class="card">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_Starry_Night.jpg"
        alt="風景畫">

        <div class="card-body">
            <h5 class="card-title">風景畫</h5>
            <p class="card-text">展現自然景色的美感。</p>
        </div>
    </div>

    <!-- 第十二張 -->
    <div class="card">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_Sunflowers_-_VGM_F458.jpg"
        alt="橄欖樹">

        <div class="card-body">
            <h5 class="card-title">橄欖樹</h5>
            <p class="card-text">運用旋轉筆觸描繪樹木。</p>
        </div>
    </div>

</div>

<!-- 頁尾 -->
<footer>
    <p>Van Gogh Art Gallery © 2026</p>
    <p>梵谷藝術作品欣賞</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
